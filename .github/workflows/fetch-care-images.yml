name: Fetch care images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fetch_care_images.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/fetch_care_images.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/care/candidates tools/care-candidates.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Download care image candidates"
          git pull --rebase origin main
          git push
